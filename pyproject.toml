[project]
name = "aiohttp-request-id-logging"
version = "1.0.1"
description = "Setup proper request id logging for your Aiohttp app"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["aiohttp", "logging"]
maintainers = [
  {name = "Petr Messner", email = "petr.messner@gmail.com" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Framework :: aiohttp",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "aiohttp>=3.8",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest",
    "ruff",
    "sentry-sdk>=2.73.0",
    "ty>=0.0.92",
]

[project.urls]
"Homepage" = "https://github.com/messa/aiohttp-request-id-logging"
"Bug Reports" = "https://github.com/messa/aiohttp-request-id-logging/issues"
"Source" = "https://github.com/messa/aiohttp-request-id-logging"

[build-system]
# setuptools>=77 is needed for the SPDX license expression and license-files
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
aiohttp_request_id_logging = ["py.typed"]

[tool.mypy]
# mypy is run in addition to ty: users of this library mostly type check
# their projects with mypy, so the published types must pass it too
files = ["aiohttp_request_id_logging", "tests", "examples"]
check_untyped_defs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# The library itself is checked strictly, tests and examples are not
# (they are mostly unannotated). These are the flags enabled by --strict -
# strict = true cannot be used here, it would apply to all modules.
module = "aiohttp_request_id_logging.*"
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
# ruff's default rule set plus E501, so that line-length is enforced
# even on lines the formatter does not wrap (strings, comments)
select = ["E4", "E7", "E9", "F", "E501"]

[tool.ruff.lint.per-file-ignores]
# the examples intentionally import names that are only used in comments
# and docstrings
"examples/*" = ["F401"]

[tool.ruff.format]
quote-style = "double"
